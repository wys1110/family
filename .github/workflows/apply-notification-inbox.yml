name: Apply notification inbox update

on:
  push:
    branches:
      - feature/notification-inbox-20260802
    paths:
      - .github/workflows/apply-notification-inbox.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify sources
        shell: bash
        run: |
          set -euo pipefail

          cat .notification-update/notification-center.js.b64.* \
            | base64 --decode > notification-center.js

          cat \
            .notification-update/daily-briefing-push-index.ts.b64.00 \
            .notification-final/edge.03 \
            .notification-final/edge.04 \
            .notification-final/edge.05 \
            .notification-final/edge.06 \
            .notification-final/edge.07 \
            .notification-final/edge.08 \
            .notification-final/edge.09 \
            | base64 --decode > supabase/functions/daily-briefing-push/index.ts

          cp .notification-final/20260802_notification_history.sql \
            supabase/migrations/20260802_notification_history.sql

          printf '%s  %s\n' \
            'cd5a650ffb2b16ea86016b07f5d21869b239b92bff2ffad2f432655d36380b3e' \
            'notification-center.js' \
            '2ade1e6051e5733cc4ef6df6942a7249acbf6684b5024efacd53d818c7a0e583' \
            'supabase/functions/daily-briefing-push/index.ts' \
            'ef8b0330de3e937e47f4608f91b51dcff646ef4584ff92f6203e841a15eb0824' \
            'supabase/migrations/20260802_notification_history.sql' \
            | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import re

          service_worker = Path('service-worker.js')
          text = service_worker.read_text()
          anchor = '    url.pathname.endsWith("/notification-center.css") ||\n'
          addition = '    url.pathname.endsWith("/notification-center.js") ||\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('service worker anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          service_worker.write_text(text)

          config = Path('config.js')
          text = config.read_text()
          text, count = re.subn(
              r'"notification-center\.js\?v=[^"]+"',
              '"notification-center.js?v=20260802-persistent-inbox-v1"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('notification module version anchor missing')
          config.write_text(text)
          PY

          node --check notification-center.js
          node --check service-worker.js
          node --check config.js

      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .notification-update .notification-final
          git rm .github/workflows/apply-notification-inbox.yml
          git add \
            notification-center.js \
            service-worker.js \
            config.js \
            supabase/functions/daily-briefing-push/index.ts \
            supabase/migrations/20260802_notification_history.sql
          git commit -m '알림 목록과 이력 동기화 구현'
          git push
